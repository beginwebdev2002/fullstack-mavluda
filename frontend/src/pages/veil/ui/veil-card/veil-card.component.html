<!-- Card Container -->
<div
  class="bg-white rounded-[2rem] p-6 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:shadow-[0_8px_30px_rgb(212,175,53,0.12)] transition-all duration-300 group relative flex flex-col h-full border border-gray-100/50 hover:border-primary/20"
>
  <!-- Top Section: Image & Price -->
  <div class="flex justify-between items-start mb-4 relative z-10">
    <div
      class="w-24 h-24 rounded-full overflow-hidden border-[3px] border-white shadow-lg cursor-pointer transform group-hover:scale-105 transition-transform duration-500"
      (click)="onViewImage()"
    >
      <img
        [src]="safeImageUrl()"
        [alt]="veil().name"
        class="w-full h-full object-cover"
      />
    </div>
    <div class="flex flex-col items-end">
      <span class="font-serif text-xl font-bold text-gray-900 tracking-tight"
        >{{ veil().price }} TJS</span
      >
      <!-- Background decorative glow -->
      <div
        class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full blur-3xl -z-10 pointer-events-none group-hover:bg-primary/10 transition-colors duration-500"
      ></div>
    </div>
  </div>

  <!-- Title Section -->
  <div class="mb-6 relative z-10">
    <h3
      class="text-2xl font-serif text-gray-900 mb-1 leading-tight group-hover:text-primary transition-colors duration-300"
    >
      {{ veil().name }}
    </h3>
    <p class="text-[10px] tracking-[0.2em] text-gray-400 uppercase font-bold">
      {{ veil().sku }}
    </p>
  </div>

  <!-- Details Block -->
  <div
    class="bg-gray-50/80 backdrop-blur-sm rounded-2xl p-5 mb-6 space-y-3.5 flex-grow border border-gray-100 group-hover:border-primary/10 transition-colors"
  >
    <div class="flex justify-between items-center text-sm">
      <span class="text-gray-400 font-medium text-xs uppercase tracking-wide"
        >Silhouette</span
      >
      <span class="font-bold font-serif text-gray-900 text-[13px]">{{
        veil().silhouette
      }}</span>
    </div>
    <div class="flex justify-between items-center text-sm">
      <span class="text-gray-400 font-medium text-xs uppercase tracking-wide"
        >Neckline</span
      >
      <span class="font-semibold font-serif text-gray-900 text-[13px]">{{
        veil().neckline
      }}</span>
    </div>
    <div class="flex justify-between items-center text-sm">
      <span class="text-gray-400 font-medium text-xs uppercase tracking-wide"
        >Fabric</span
      >
      <span class="font-semibold font-serif text-gray-900 text-[13px]">{{
        veil().fabric
      }}</span>
    </div>
    <div class="flex justify-between items-center text-sm">
      <span class="text-gray-400 font-medium text-xs uppercase tracking-wide"
        >Train Length</span
      >
      <span class="font-semibold font-serif text-gray-900 text-[13px]">{{
        veil().trainLength
      }}</span>
    </div>
    <div
      class="flex justify-between items-center text-sm pt-2 border-t border-gray-200/50 mt-2"
    >
      <span class="text-gray-400 font-medium text-xs uppercase tracking-wide"
        >Availability</span
      >
      @if (veil().stock > 0) {
        <span
          class="font-bold font-serif text-green-600 text-[13px]"
          i18n="@@veilInStock"
          >In Stock</span
        >
      } @else {
        <span
          class="font-bold font-serif text-red-500 text-[13px]"
          i18n="@@veilOutOfStock"
          >Out of Stock</span
        >
      }
    </div>
  </div>

  <!-- Footer: Actions -->
  <div
    class="flex items-center justify-end gap-3 pt-2 relative z-10 border-t border-gray-100 mt-auto"
  >
    <!-- Delete (Visual Placeholder - Future Implementation) -->
    <button
      class="w-10 h-10 rounded-full bg-red-50 text-red-400 hover:text-red-600 hover:bg-red-100 flex items-center justify-center transition-all duration-300"
      title="Delete"
    >
      <span class="material-symbols-outlined text-lg">delete</span>
    </button>

    <!-- Edit -->
    <button
      (click)="onEdit()"
      class="w-10 h-10 rounded-full bg-primary/10 text-primary hover:bg-primary hover:text-white flex items-center justify-center transition-all duration-300 shadow-sm"
      title="Edit"
    >
      <span class="material-symbols-outlined text-lg">edit</span>
    </button>

    <!-- Menu / More -->
    <button
      class="w-10 h-10 rounded-full bg-gray-50 text-gray-400 hover:text-gray-600 hover:bg-gray-100 flex items-center justify-center transition-all duration-300"
      title="More"
    >
      <span class="material-symbols-outlined text-lg">more_vert</span>
    </button>
  </div>
</div>
