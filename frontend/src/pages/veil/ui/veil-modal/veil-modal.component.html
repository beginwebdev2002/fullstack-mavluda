<div class="fixed inset-0 z-[120] overflow-y-auto" role="dialog" aria-modal="true">
    <!-- Backdrop -->
    <div class="fixed inset-0 bg-black/70 backdrop-blur-sm transition-opacity animate-fade-in" (click)="onCancel()"></div>
    
    <div class="flex min-h-screen items-center justify-center p-4">
       <div class="relative w-full max-w-3xl transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all border border-gold/10 animate-slide-up">
          
          <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center">
            <h3 class="text-xl font-serif font-bold text-gray-900">
              @if(!isEditMode()) { <span i18n="@@veilModalTitleNew">Add New Gown</span> } @else { <span i18n="@@veilModalTitleEdit">Edit Gown Details</span> }
            </h3>
            <button (click)="onCancel()" class="text-gray-400 hover:text-gray-500 transition-colors">
              <span class="material-symbols-outlined">close</span>
            </button>
          </div>

          <div class="px-6 py-6 grid grid-cols-1 md:grid-cols-3 gap-x-8">
            <!-- Image Uploader -->
            <div class="md:col-span-1 space-y-2 mb-6 md:mb-0">
                <label class="block text-sm font-medium text-gray-700">Gown Image</label>
                <div (click)="fileInput.click()" class="aspect-square w-full rounded-xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center relative group cursor-pointer hover:border-gold transition-colors bg-gray-50">
                    @if (previewImage()) {
                        <img [src]="previewImage()" alt="Gown preview" class="w-full h-full object-cover rounded-lg absolute inset-0">
                        <div class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-lg">
                          <div class="text-center text-white">
                            <span class="material-symbols-outlined text-3xl">edit</span>
                            <p class="text-xs mt-1 font-semibold">Change Image</p>
                          </div>
                        </div>
                    } @else {
                        <div class="text-center text-gray-500">
                            <span class="material-symbols-outlined text-4xl">add_photo_alternate</span>
                            <p class="text-xs mt-2 font-semibold">Click to upload</p>
                        </div>
                    }
                </div>
                <input #fileInput type="file" class="hidden" (change)="onFileSelected($event)" accept="image/png, image/jpeg, image/webp">
                
                <div class="mt-4">
                   <label class="inline-flex items-center cursor-pointer">
                      <input type="checkbox" [(ngModel)]="isAvailable" class="sr-only peer">
                      <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-gold/30 rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-gold"></div>
                      <span class="ms-3 text-sm font-medium text-gray-700">Available for Sale</span>
                    </label>
                </div>
            </div>
            
            <!-- Form Fields -->
            <div class="md:col-span-2 space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Name</label>
                    <input type="text" [(ngModel)]="name" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all" required>
                  </div>
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Category</label>
                    <select [(ngModel)]="category" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all">
                        <option value="Bridal">Bridal</option>
                        <option value="Evening">Evening</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                  </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Price (TJS)</label>
                    <input type="number" [(ngModel)]="price" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all" required min="0">
                  </div>
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Rental Price (TJS)</label>
                    <input type="number" [(ngModel)]="rentalPrice" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all" required min="0">
                  </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">SKU</label>
                    <input type="text" [(ngModel)]="sku" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all">
                  </div>
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Stock Quantity</label>
                    <input type="number" [(ngModel)]="stock" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all" required min="0">
                  </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Silhouette</label>
                    <input type="text" [(ngModel)]="silhouette" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all">
                  </div>
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Neckline</label>
                    <input type="text" [(ngModel)]="neckline" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all">
                  </div>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Fabric</label>
                    <input type="text" [(ngModel)]="fabric" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all">
                  </div>
                  <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Train Length</label>
                    <input type="text" [(ngModel)]="trainLength" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all">
                  </div>
                </div>
                
                <div class="space-y-2">
                    <label class="block text-sm font-medium text-gray-700">Description</label>
                    <textarea [(ngModel)]="description" rows="3" class="block w-full rounded-lg border-gray-300 bg-gray-50 text-gray-900 focus:bg-white focus:border-gold focus:ring-gold sm:text-sm p-2.5 transition-all"></textarea>
                </div>
            </div>
          </div>

          <div class="bg-gray-50 px-6 py-4 flex flex-row-reverse border-t border-gray-100 gap-3">
            <button (click)="onSave()" type="button" [disabled]="!name() || price() < 0" class="inline-flex justify-center rounded-lg bg-gold px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-gold/30 hover:bg-gold-dark hover:shadow-gold/50 transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
              @if(!isEditMode()) { <span i18n="@@veilBtnCreate">Create Gown</span> } @else { <span i18n="@@veilBtnSave">Save Changes</span> }
            </button>
            <button (click)="onCancel()" type="button" class="inline-flex justify-center rounded-lg bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-all">
              Cancel
            </button>
          </div>
       </div>
    </div>
 </div>
