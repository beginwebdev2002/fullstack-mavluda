<!-- Main Page Content -->
<div class="flex-1 overflow-y-auto p-8 custom-scrollbar animate-page-enter">
  <!-- Header Section -->
  <div
    class="flex flex-col md:flex-row md:items-end justify-between mb-10 gap-4"
  >
    <div>
      <h1
        class="text-4xl font-serif text-gray-900 mb-2"
        i18n="@@veilAdminTitle"
      >
        Bridal Gown Collection
      </h1>
      <p class="text-gray-500 font-light text-lg" i18n="@@veilAdminSubtitle">
        Exquisite wedding dresses and their characteristics.
      </p>
    </div>
    <div class="flex items-center gap-4">
      <!-- View Switcher -->
      <div class="flex bg-white rounded-lg p-1 border border-gray-200">
        <button 
          (click)="viewMode.set('grid')"
          class="p-2 rounded transition-colors"
          [class]="viewMode() === 'grid' 
            ? 'bg-gray-100 text-primary' 
            : 'hover:bg-gray-100 text-gray-400'"
          title="Grid View"
        >
          <span class="material-symbols-outlined">grid_view</span>
        </button>
        <button 
          (click)="viewMode.set('list')"
          class="p-2 rounded transition-colors"
          [class]="viewMode() === 'list' 
            ? 'bg-gray-100 text-primary' 
            : 'hover:bg-gray-100 text-gray-400'"
          title="List View"
        >
          <span class="material-symbols-outlined">list</span>
        </button>
      </div>

      <button
        (click)="openAddModal()"
        class="flex items-center px-5 py-2.5 bg-primary hover:bg-primary-hover text-white rounded-lg shadow-gold hover:shadow-gold-lg transition-all font-medium"
        aria-label="Add New Gown"
        i18n-aria-label="@@veilAdminAddBtn"
      >
        <span class="material-symbols-outlined">add</span>
      </button>
    </div>
  </div>

  <!-- Veil Content -->
  @if (viewMode() === 'grid') {
    <!-- Grid View -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      @for (veil of veils(); track veil.id; let i = $index) {
        <app-card-view
          [data]="veil"
          [config]="veilCardConfig"
          [index]="i"
          (edit)="openEditModal($event)"
          (viewImage)="openImageModal($event)"
          (delete)="onDeleteCard($event.toString())"
        >
        </app-card-view>
      }
    </div>
  } @else {
    <!-- List View -->
    <div class="animate-page-enter">
      <app-list-view
        [items]="veils()"
        [columns]="columns()"
        (edit)="openEditModal($event)"
        (delete)="onDeleteCard($event.toString())"
        (view)="openImageModal($event)"
      >
        <ng-template #customCell let-item let-column="column">
          @if (column.key === 'image') {
            <div 
              class="w-12 h-12 rounded-full overflow-hidden border-2 border-white shadow-sm cursor-pointer hover:scale-105 transition-transform"
              (click)="openImageModal(item.image)"
            >
              <img [src]="getSafeImageUrl(item.image)" [alt]="item.name" class="w-full h-full object-cover">
            </div>
          } @else if (column.key === 'price') {
            <span class="font-bold text-gray-900">{{ item.price }} TJS</span>
          }
        </ng-template>
      </app-list-view>
    </div>
  }
</div>

<!-- Edit Modal -->
@if (isVeilFormOpen()) {
  <app-veil-form
    [veil]="editingVeil()"
    (save)="handleSave($event)"
    (cancel)="closeEditModal()"
  >
  </app-veil-form>
}

<!-- Fullscreen Image Modal -->
<app-image-popup
  [imageUrl]="selectedImage()"
  title="Mavluda Beauty • Wedding Collection"
  loadingText="Loading Asset"
  (close)="closeImageModal()"
></app-image-popup>
