
<div class="bg-background-light dark:bg-background-dark font-sans transition-colors duration-300 min-h-screen flex flex-col items-center justify-center p-4 animate-page-enter">

  <header class="text-center mb-10">
    <div class="relative inline-block mb-6">
      <div class="w-20 h-20 rounded-full border border-primary flex items-center justify-center bg-black/40 backdrop-blur-sm gold-glow">
        <span class="font-display text-4xl text-primary font-semibold select-none">M</span>
      </div>
      <div class="absolute -inset-4 bg-primary/5 blur-2xl rounded-full -z-10"></div>
    </div>
    <h1 class="font-display text-4xl md:text-5xl text-gray-900 dark:text-white mb-2 tracking-tight select-none">Mavluda Beauty</h1>
    <p class="font-accent text-[10px] md:text-xs tracking-[0.3em] text-primary uppercase font-bold select-none">Medical Luxury Ecosystem</p>
  </header>

  <main class="w-full max-w-[440px]">
    <div class="bg-white dark:bg-card-dark border border-gray-200 dark:border-white/10 rounded-2xl overflow-hidden shadow-2xl">
      <div class="flex border-b border-primary/30">
        <button 
          (click)="setAuthMode('signin')"
          class="flex-1 py-4 text-sm font-semibold transition-colors select-none"
          [class]="authMode() === 'signin' 
            ? 'text-primary' 
            : 'text-gray-500 hover:text-gray-700'">
          Sign In
        </button>
        <button 
          (click)="setAuthMode('signup')"
          class="flex-1 py-4 text-sm font-semibold transition-colors select-none"
          [class]="authMode() === 'signup' 
            ? 'text-primary' 
            : 'text-gray-500 hover:text-gray-700'">
          Sign Up
        </button>
      </div>
      <div class="p-8">
        @if (authMode() === 'signin') {
          <app-signin-form (submitted)="onSignInSubmit($event)"></app-signin-form>
        } @else {
          <app-signup-form (submitted)="onSignupSubmit($event)"></app-signup-form>
        }
      </div>

      <div class="px-8 py-4 bg-gray-50/50 dark:bg-black/20 border-t border-gray-200 dark:border-white/10 text-center">
        <p class="text-[11px] text-gray-500 tracking-wide uppercase font-accent select-none">
          Secure Access • End-to-End Encrypted
        </p>
      </div>
    </div>

    <div class="mt-8 flex justify-center items-center space-x-6">
      <button (click)="toggleTheme()" class="text-gray-400 hover:text-primary transition-colors flex items-center space-x-2 text-sm">
        <span class="material-symbols-outlined text-[18px]">dark_mode</span>
        <span>Switch Theme</span>
      </button>
      <div class="text-gray-700 dark:text-gray-600">|</div>
      <app-language-switcher [variant]="isDarkMode() ? 'dark' : 'light'"></app-language-switcher>
    </div>
  </main>

  <footer class="mt-auto py-8 text-center text-gray-400 text-xs select-none">
    <p>© 2024 Mavluda Azizova. All rights reserved.</p>
  </footer>
</div>
