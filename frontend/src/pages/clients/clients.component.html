<div class="p-6 max-w-7xl mx-auto text-gray-800">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-light tracking-wide text-gray-900 border-b border-gray-200 pb-2">Client Management</h1>
    <button 
      (click)="openCreate()" 
      class="px-5 py-2.5 bg-black text-white text-sm tracking-widest uppercase hover:bg-gray-800 transition-colors duration-300">
      Add Client
    </button>
  </div>

  @if (error()) {
    <div class="bg-red-50 text-red-600 p-4 mb-6 border border-red-100 rounded-sm">
      {{ error() }}
    </div>
  }

  @if (loading() && clients().length === 0) {
    <div class="flex justify-center py-12">
      <div class="animate-pulse w-8 h-8 rounded-full border-2 border-black border-t-transparent animate-spin"></div>
    </div>
  } @else {
    <!-- Clients List -->
    <div class="animate-page-enter">
      <app-list-view
        [items]="clients()"
        [columns]="columns()"
        (edit)="openEdit($event)"
        (delete)="deleteClient($event.toString())"
      >
      </app-list-view>
    </div>
  }
</div>

<!-- Edit Modal -->
@if (isModalOpen()) {
  <app-client-form
    [formData]="formData()"
    [isEditing]="isEditing()"
    [loading]="loading()"
    (save)="saveClient($event)"
    (cancel)="resetForm()">
  </app-client-form>
}
