<div
  class="space-y-6 relative animate-page-enter max-w-[1200px] mx-auto p-4 md:p-6 lg:p-0 lg:py-6"
>
  <!-- Header and Add Button -->
  <div class="flex flex-col sm:flex-row justify-between sm:items-end gap-4">
    <div>
      <h2 class="text-3xl font-serif text-gray-900" i18n="@@servicesTitle">
        Services & Treatments
      </h2>
      <p class="text-gray-500 mt-2" i18n="@@servicesSubtitle">
        Manage your luxury treatment offerings.
      </p>
    </div>
  </div>

  <!-- Controls -->
  <div
    class="flex flex-col sm:flex-row justify-between items-end sm:items-center pb-2 border-b border-gray-100 gap-4"
  >
    <!-- Filters -->
    <div class="flex space-x-6 overflow-x-auto no-scrollbar w-full sm:w-auto grow">
      @for (filter of filters; track filter) {
        <button
          (click)="setFilter(filter)"
          class="text-sm font-medium pb-3 transition-all duration-300 whitespace-nowrap relative"
          [class]="
            activeFilter() === filter
              ? 'text-gray-900'
              : 'text-gray-500 hover:text-gold'
          "
        >
          @if (filter === "All") {
            <ng-container i18n="@@servicesFilterAll">All Services</ng-container>
          } @else {
            {{ filter }}
          }
          @if (activeFilter() === filter) {
            <span
              class="absolute bottom-0 left-0 w-full h-0.5 bg-gold animate-fade-in"
            ></span>
          }
        </button>
      }
    </div>

    <!-- View Mode Switcher -->
    <div class="flex bg-gray-100 p-1 rounded-lg shrink-0">
      <button
        (click)="viewMode.set('list')"
        [class]="
          viewMode() === 'list'
            ? 'bg-white text-gray-900 shadow-sm'
            : 'text-gray-500 hover:text-gray-700'
        "
        class="p-2 rounded-md transition-all duration-200"
        title="List View"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
      </button>
      <button
        (click)="viewMode.set('card')"
        [class]="
          viewMode() === 'card'
            ? 'bg-white text-gray-900 shadow-sm'
            : 'text-gray-500 hover:text-gray-700'
        "
        class="p-2 rounded-md transition-all duration-200"
        title="Card View"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
      </button>
    </div>
    <button (click)="openAddModal()" class="flex items-center px-5 py-2.5 ml-2 bg-primary hover:bg-primary-hover text-white rounded-lg shadow-gold hover:shadow-gold-lg transition-all font-medium">
        <span class="material-symbols-outlined mr-2">add_photo_alternate</span>
      </button>
  </div>

  <!-- Views -->
  @if (viewMode() === "list") {
    <div class="animate-page-enter">
      <app-list-view
        [items]="filteredTreatments()"
        [columns]="columns()"
        (edit)="openEditModal($event)"
        (delete)="deleteTreatment($event)"
      >
        <ng-template #customCell let-item>
          <div class="text-sm font-serif font-medium text-gray-900">
            {{ item.price }} TJS
          </div>
        </ng-template>
      </app-list-view>
    </div>
  } @else {
    <!-- Card View -->
    <div
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 animate-page-enter"
    >
      @for (
        treatment of filteredTreatments();
        track treatment.id;
        let i = $index
      ) {
        <app-treatment-card
          [treatment]="treatment"
          [index]="i"
          (edit)="openEditModal($event)"
          (delete)="deleteTreatment($event)"
        ></app-treatment-card>
      }
    </div>
  }
</div>

<!-- Edit Modal -->
@if (isEditModalOpen()) {
  <app-treatment-form
    [treatment]="tempTreatment"
    (save)="onSaveTreatment($event)"
    (cancel)="closeEditModal()"
  ></app-treatment-form>
}
