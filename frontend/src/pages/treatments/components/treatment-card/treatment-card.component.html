<div
  class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-gold hover:border-gold/30 transition-all duration-300 group flex flex-col h-full reveal-item"
  [style.animation-delay.ms]="index() * 100"
>
  @if (imageUrl()) {
    <div class="h-48 -mx-6 -mt-6 mb-4 rounded-t-xl overflow-hidden relative">
      <img
        [src]="imageUrl()"
        alt="Treatment"
        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
      />
      <div
        class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent"
      ></div>
      <div
        class="absolute bottom-4 left-4 right-4 flex justify-between items-center"
      >
        <span
          class="px-2.5 py-1 text-xs font-medium rounded-full bg-white/90 text-gray-900 shadow-sm backdrop-blur-sm"
        >
          {{ treatment().category }}
        </span>

        <span class="relative flex h-2.5 w-2.5">
          @if (treatment().active) {
            <span
              class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"
            ></span>
            <span
              class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"
            ></span>
          } @else {
            <span
              class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"
            ></span>
          }
        </span>
      </div>
    </div>
  } @else {
    <div class="flex justify-between items-start mb-4">
      <span
        class="px-2.5 py-1 text-xs font-medium rounded-full bg-gray-50 text-gray-600 border border-gray-100"
      >
        {{ treatment().category }}
      </span>

      <span class="relative flex h-2.5 w-2.5">
        @if (treatment().active) {
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"
          ></span>
          <span
            class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"
          ></span>
        } @else {
          <span
            class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500"
          ></span>
        }
      </span>
    </div>
  }

  <div class="flex-1">
    <h3
      class="text-xl font-serif font-bold text-gray-900 mb-2 group-hover:text-gold transition-colors"
    >
      {{ treatment().name }}
    </h3>

    <div class="flex flex-col space-y-2 mt-4">
      <div class="flex items-center text-sm text-gray-500">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="mr-2 text-gold"
        >
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        {{ treatment().duration }}
      </div>
      <div class="flex items-center text-sm text-gray-500">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="mr-2 text-gold"
        >
          <path d="M20.2 6 3 11l-.9-2.4c-.5-1.1.5-2.2 1.7-1.7l13.2 5.5" />
          <path d="m3 11 16 9c.6.3 1.3-.3 1.1-.9l-6-13.2" />
        </svg>
        <span class="font-medium text-gray-900"
          >{{ treatment().price }} TJS</span
        >
      </div>
    </div>
  </div>

  <div
    class="mt-6 pt-4 border-t border-gray-50 flex justify-between items-center"
  >
    <span
      class="text-xs font-medium px-2 py-1 rounded"
      [class]="
        treatment().active
          ? 'bg-green-50 text-green-700'
          : 'bg-red-50 text-red-700'
      "
    >
      @if (treatment().active) {
        <ng-container i18n="@@statusActive">Active</ng-container>
      } @else {
        <ng-container i18n="@@statusInactive">Inactive</ng-container>
      }
    </span>
    <div class="flex items-center space-x-3">
      <button
        (click)="onEdit()"
        class="p-1.5 text-gray-400 bg-gray-50 hover:bg-gold/10 hover:text-gold rounded-md transition-all"
        title="Edit"
        i18n-title="@@servicesEditAction"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"
          ></path>
          <path
            d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"
          ></path>
        </svg>
      </button>
      <button
        (click)="onDelete()"
        class="p-1.5 text-gray-400 bg-gray-50 hover:bg-red-50 hover:text-red-500 rounded-md transition-all"
        title="Delete"
        i18n-title="@@servicesDeleteAction"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path
            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2"
          ></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </div>
  </div>
</div>
