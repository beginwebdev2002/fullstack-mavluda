<div
  class="fixed inset-0 z-[100] overflow-y-auto"
  role="dialog"
  aria-modal="true"
>
  <div
    class="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity animate-fade-in"
    (click)="closeEditModal()"
  ></div>

  <div class="flex min-h-screen items-center justify-center p-4">
    <div
      class="relative w-full max-w-3xl transform overflow-hidden rounded-2xl bg-white text-left shadow-2xl transition-all border border-gold/10 animate-slide-up"
    >
      <div
        class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex justify-between items-center"
      >
        <h3 class="text-xl font-serif font-bold text-gray-900">
          @if (tempTreatment().id === 0 || tempTreatment().id === "") {
            <span i18n="@@servicesModalTitleNew">Add New Service</span>
          } @else {
            <span i18n="@@servicesModalTitleEdit">Edit Service</span>
          }
        </h3>
        <button
          (click)="closeEditModal()"
          class="text-gray-400 hover:text-gray-500 transition-colors"
        >
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <div class="px-6 py-6 grid grid-cols-1 md:grid-cols-3 gap-x-8">
        <!-- Image Uploader -->
        <div class="md:col-span-1 space-y-2 mb-6 md:mb-0">
          <label class="block text-sm font-medium text-gray-700"
            >Service Image</label
          >
          <div
            (click)="fileInput.click()"
            class="aspect-square w-full rounded-xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center relative group cursor-pointer hover:border-gold transition-colors bg-gray-50 flex-shrink-0"
          >
            @if (previewImage()) {
              <img
                [src]="previewImage()"
                alt="Service preview"
                class="w-full h-full object-cover rounded-lg absolute inset-0"
              />
              <div
                class="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-lg"
              >
                <div class="text-center text-white">
                  <span class="material-symbols-outlined text-3xl">edit</span>
                  <p class="text-xs mt-1 font-semibold">Change Image</p>
                </div>
              </div>
            } @else {
              <div class="text-center text-gray-500">
                <span class="material-symbols-outlined text-4xl"
                  >add_photo_alternate</span
                >
                <p class="text-xs mt-2 font-semibold">Click to upload</p>
              </div>
            }
          </div>
          <input
            #fileInput
            type="file"
            class="hidden"
            (change)="onFileSelected($event)"
            accept="image/png, image/jpeg, image/webp"
          />

          <div class="mt-4">
            <label
              class="block text-sm font-medium text-gray-700 mb-1.5"
              i18n="@@fieldStatus"
              >Status</label
            >
            <button
              (click)="toggleTempActive()"
              type="button"
              [class]="
                tempTreatment().active
                  ? 'bg-green-50 text-green-700 border-green-200 ring-green-500/20'
                  : 'bg-red-50 text-red-700 border-red-200 ring-red-500/20'
              "
              class="w-full inline-flex justify-center items-center px-4 py-2.5 rounded-lg text-sm font-medium transition-all border hover:opacity-90"
            >
              @if (tempTreatment().active) {
                <ng-container i18n="@@statusActive">Active</ng-container>
              } @else {
                <ng-container i18n="@@statusInactive">Inactive</ng-container>
              }
            </button>
          </div>
        </div>

        <div class="md:col-span-2 space-y-5">
          <div>
            <label
              class="block text-sm font-medium text-gray-700 mb-1.5"
              i18n="@@fieldServiceName"
              >Service Name</label
            >
            <input
              type="text"
              [(ngModel)]="tempTreatment().name"
              class="block w-full rounded-lg bg-white border border-gray-300 text-gray-900 focus:ring-2 focus:ring-gold/50 focus:border-gold sm:text-sm p-2.5 transition-all shadow-sm"
            />
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1.5"
                i18n="@@fieldCategory"
                >Category</label
              >
              <select
                [(ngModel)]="tempTreatment().category"
                class="block w-full rounded-lg bg-white border border-gray-300 text-gray-900 focus:ring-2 focus:ring-gold/50 focus:border-gold sm:text-sm p-2.5 transition-all shadow-sm"
              >
                <option value="Injectables">Injectables</option>
                <option value="Facials">Facials</option>
                <option value="Laser">Laser</option>
              </select>
            </div>

            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1.5"
                i18n="@@fieldPrice"
                >Price (TJS)</label
              >
              <input
                type="number"
                [(ngModel)]="tempTreatment().price"
                class="block w-full rounded-lg bg-white border border-gray-300 text-gray-900 focus:ring-2 focus:ring-gold/50 focus:border-gold sm:text-sm p-2.5 transition-all shadow-sm"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label
                class="block text-sm font-medium text-gray-700 mb-1.5"
                i18n="@@fieldDuration"
                >Duration (mins)</label
              >
              <input
                type="number"
                [(ngModel)]="tempTreatment().duration"
                class="block w-full rounded-lg bg-white border border-gray-300 text-gray-900 focus:ring-2 focus:ring-gold/50 focus:border-gold sm:text-sm p-2.5 transition-all shadow-sm"
              />
            </div>
          </div>

          <div class="space-y-2">
            <label
              class="block text-sm font-medium text-gray-700"
              i18n="@@fieldDescription"
              >Description</label
            >
            <textarea
              [(ngModel)]="tempTreatment().description"
              rows="3"
              class="block w-full rounded-lg bg-white border border-gray-300 text-gray-900 focus:ring-2 focus:ring-gold/50 focus:border-gold sm:text-sm p-2.5 transition-all shadow-sm"
            ></textarea>
          </div>
        </div>
      </div>

      <div
        class="bg-gray-50 px-6 py-4 flex flex-row-reverse border-t border-gray-100 gap-3"
      >
        <button
          (click)="saveEdit()"
          type="button"
          class="inline-flex justify-center rounded-lg bg-gold px-4 py-2 text-sm font-semibold text-white shadow-lg shadow-gold/30 hover:bg-gold-dark hover:shadow-gold/50 transition-all transform active:scale-95"
        >
          @if (tempTreatment().id === 0) {
            <span i18n="@@servicesBtnCreate">Create Service</span>
          } @else {
            <span i18n="@@servicesBtnSave">Save Changes</span>
          }
        </button>
        <button
          (click)="closeEditModal()"
          type="button"
          class="inline-flex justify-center rounded-lg bg-white px-4 py-2 text-sm font-semibold text-gray-700 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 transition-all"
        >
          <ng-container i18n="@@actionCancel">Cancel</ng-container>
        </button>
      </div>
    </div>
  </div>
</div>
