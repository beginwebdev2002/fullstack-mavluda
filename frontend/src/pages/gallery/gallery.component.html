
<div class="p-8 pb-20 animate-page-enter">
  <!-- Header -->
  <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
    <div>
      <h2 class="font-serif text-4xl text-gray-900 mb-2" i18n="@@galleryTitle">Gallery &amp; Portfolio</h2>
      <p class="text-gray-500" i18n="@@gallerySubtitle">Manage your luxury portfolio imagery and categories.</p>
    </div>
    <div class="flex space-x-3">
      <div class="flex bg-white rounded-lg p-1 border border-gray-200">
        <button 
          (click)="viewMode.set('grid')"
          class="p-2 rounded transition-colors"
          [class]="viewMode() === 'grid' 
            ? 'bg-gray-100 text-primary' 
            : 'hover:bg-gray-100 text-gray-400'">
          <span class="material-symbols-outlined">grid_view</span>
        </button>
        <button 
          (click)="viewMode.set('list')"
          class="p-2 rounded transition-colors"
          [class]="viewMode() === 'list' 
            ? 'bg-gray-100 text-primary' 
            : 'hover:bg-gray-100 text-gray-400'">
          <span class="material-symbols-outlined">list</span>
        </button>
      </div>
      <button (click)="openAddModal()" class="flex items-center px-5 py-2.5 bg-primary hover:bg-primary-hover text-white rounded-lg shadow-gold hover:shadow-gold-lg transition-all font-medium">
        <span class="material-symbols-outlined mr-2">add_photo_alternate</span>
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="flex flex-wrap items-center gap-6 mb-8 border-b border-gray-200 pb-1">
    @for(filter of filters(); track filter) {
      <button 
        (click)="activeFilter.set(filter)"
        class="pb-3 border-b-2 font-medium text-sm transition-colors"
        [class]="activeFilter() === filter 
          ? 'border-primary text-primary' 
          : 'border-transparent text-gray-500 hover:text-gray-700'"
      >
        @if(filter === 'all') { <ng-container i18n="@@galleryFilterAll">All Images</ng-container> } @else { {{ filter }} }
      </button>
    }
  </div>

  @if (viewMode() === 'grid') {
    <!-- Image Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 animate-page-enter">
      @for(image of filteredImages(); track image.id; let i = $index) {
        <app-card-view
          [data]="image"
          [config]="galleryCardConfig"
          [index]="i"
          (edit)="openModal($event)"
          (viewImage)="openImageModal($event)"
          (delete)="deleteImage($event.toString())"
        ></app-card-view>
      }
    </div>
  } @else {
    <!-- List View -->
    <div class="animate-page-enter">
      <app-list-view 
        [items]="filteredImages()" 
        [columns]="columns()"
        (edit)="openModal($event)"
        (delete)="deleteImage($event.toString())"
        (view)="openImageModal($event)"
      ></app-list-view>
    </div>
  }
</div>

<!-- Edit Modal -->
@if (isModalOpen()) {
  <app-gallery-form
    [image]="currentImage"
    [filters]="filters()"
    (save)="saveImage($event)"
    (cancel)="closeModal()"
  ></app-gallery-form>
}

<!-- Image Modal -->
<app-image-popup
  [imageUrl]="selectedImage()"
  (close)="closeImageModal()"
></app-image-popup>
