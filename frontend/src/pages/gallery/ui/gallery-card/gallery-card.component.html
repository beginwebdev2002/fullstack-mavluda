<div class="group bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col transition-all duration-300 hover:shadow-lg hover:-translate-y-1 reveal-item" [style.animation-delay.ms]="index() * 75">
  <div (click)="onViewImage()" class="relative aspect-[4/5] overflow-hidden cursor-pointer">
    <img [src]="imageUrl()" [alt]="image().alt" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"/>
    <div class="absolute top-4 left-4 bg-gray-900/80 backdrop-blur-sm px-3 py-1.5 rounded-full text-[10px] font-bold uppercase tracking-wider text-white shadow-sm">
      {{ image().category }}
    </div>
    <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
        <span class="material-symbols-outlined text-white text-4xl p-4 bg-white/10 rounded-full backdrop-blur-sm">zoom_in</span>
    </div>
  </div>
  <div class="p-5 flex-1 flex flex-col justify-between">
    <div>
      <h3 class="font-serif text-lg text-gray-900 mb-1">{{ image().title }}</h3>
    </div>
    <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-3">
      <div class="flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full" [class]="image().status === 'published' ? 'bg-green-500' : 'bg-yellow-500'" [title]="image().status"></span>
        <span class="text-xs text-gray-500">{{ image().createdAt | date:'mediumDate' }}</span>
      </div>
      <div class="flex gap-2">
        <button (click)="onDeleteCard()" class="flex items-center gap-1.5 text-xs font-medium text-red-400 hover:text-red-500 transition-all opacity-0 group-hover:opacity-100 duration-300" aria-label="Delete image">
          <span class="material-symbols-outlined !text-base">delete</span>
        </button>
        <button (click)="onEdit()" class="flex items-center gap-1.5 text-xs font-medium text-gray-500 hover:text-primary transition-all opacity-0 group-hover:opacity-100 duration-300" aria-label="Edit image details">
          <span class="material-symbols-outlined !text-base">edit</span>
        </button>
      </div>
    </div>
  </div>
</div>
