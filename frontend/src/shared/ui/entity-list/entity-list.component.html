<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
  <app-entity-card
      *ngFor="let entity of entities; let i = index"
      [entity]="entity"
      [imageUrlPath]="imageUrlPath"
      [titlePath]="titlePath"
      [descriptionPath]="descriptionPath"
      [priority]="i === 0"
      (edit)="onEdit($event)"
      (delete)="onDelete($event)"
      class="h-full"
  ></app-entity-card>
</div>
