@if (imageUrl()) {
  <div class="fixed inset-0 z-[150] flex items-center justify-center" role="dialog" aria-modal="true">
      <!-- Backdrop -->
      <div class="absolute inset-0 bg-black/90 backdrop-blur-md transition-opacity animate-fade-in" (click)="onClose()"></div>
      
      <!-- Close Button -->
      <button (click)="onClose()" class="fixed top-6 right-6 z-[160] text-white/50 hover:text-white transition-colors p-2 hover:bg-white/10 rounded-full cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary">
          <span class="sr-only">Close</span>
          <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>

      <!-- Modal Content -->
      <div class="relative z-[155] w-full h-full p-4 md:p-12 flex flex-col items-center justify-center pointer-events-none">
          <div class="pointer-events-auto relative rounded-lg overflow-hidden shadow-2xl bg-transparent animate-slide-up flex items-center justify-center min-w-[300px] min-h-[300px]">
             
             <!-- Loading State -->
             @if (isLoading()) {
                <div class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-black/40 backdrop-blur-sm">
                    <div class="w-12 h-12 border-4 border-white/20 border-t-gold rounded-full animate-spin mb-3"></div>
                    <p class="text-white/60 text-[10px] uppercase tracking-[0.2em] font-medium animate-pulse">{{ loadingText() }}</p>
                </div>
             }

             <img [src]="imageUrl()" 
                  (load)="onImageLoad()"
                  alt="Full screen view" 
                  class="max-w-full max-h-[85vh] object-contain shadow-2xl transition-all duration-700 ease-out"
                  [class.opacity-0]="isLoading()"
                  [class.scale-95]="isLoading()"
                  [class.opacity-100]="!isLoading()"
                  [class.scale-100]="!isLoading()"
             >
          </div>
          
          <p class="text-white/40 text-xs mt-6 font-medium tracking-[0.3em] uppercase animate-fade-in text-center">{{ title() }}</p>
      </div>
  </div>
}
