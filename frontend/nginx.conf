server {
    listen 80;
    server_name localhost;


    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # location /api/uploads/ {
    #     rewrite ^/api/uploads/(.*)$ /uploads/$1 break;
    #     root /usr/share/nginx/html;
    #     expires 30d;
    #     add_header Cache-Control "public, no-transform";
    # }
    location ~* ^/api/uploads/(.*)$ {
        alias /usr/share/nginx/html/uploads/$1;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /api/ {
        proxy_pass http://backend:4100/;

        if ($request_uri ~* "/api/auth/me") {
            add_header Cache-Control "no-cache, no-store, must-revalidate, proxy-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}