version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB_NAME=mavluda
      - API_PREFIX=api
      - FRONTEND_URL=http://localhost
      - JWT_SECRET=supersecret
      - JWT_EXPIRES_IN=1h
      - TELEGRAM_BOT_TOKEN=dummy
      - LOG_LEVEL=info
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data: